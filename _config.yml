# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-US"
title                    : "Pierre Vanhove"
title_separator          : "-"
name                     : &name "Pierre Vanhove"
description              : &description "Theoretical physicist at IPhT CEA-Saclay working on scattering amplitudes, Feynman integrals, and the mathematics of quantum gravity."
url                      : https://pierrevanhove.github.io
baseurl                  : ""
repository               : "pierrevanhove/pierrevanhove.github.io"
breadcrumbs              : true
words_per_minute         : 160
future                   : false
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          : "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:

# SEO Related

# Open Graph / Social sharing
og_image                 : "images/pv.png"
facebook:
  username               : "pierre.vanhove.754"
  app_id                 :
  publisher              :
social:
  type                   : Person
  name                   : "Pierre Vanhove"
  links:
    - "https://github.com/pierrevanhove"
    - "https://orcid.org/0000-0001-5115-4788"
    - "https://scholar.google.com/citations?user=Ru3MQ_gAAAAJ"

# Analytics
analytics:
  provider               : "google-universal"
  google:
    tracking_id          :

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/pierrevanhove"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=Ru3MQ_gAAAAJ"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook"
      url: "https://www.facebook.com/pierre.vanhove.754"

# Site Author
author:
  name             : "Pierre Vanhove"
  avatar           : "pv.png"
  bio              : "Theoretical physicist working on scattering amplitudes, Feynman integrals, and the mathematics of quantum gravity."
  location         : "Institut de Physique Théorique, CEA-Saclay"
  links:
    - label: "Inspire HEP"
      url: "https://inspirehep.net/authors/984979?ui-citation-summary=true"
    - label: "arXiv"
      url: "https://arxiv.org/a/vanhove_p_1.html"
    - label: "Google Scholar"
      url: "https://scholar.google.com/citations?user=Ru3MQ_gAAAAJ"
    - label: "ORCID"
      url: "https://orcid.org/0000-0001-5115-4788"
    - label: "zbMath"
      url: "https://zbmath.org/authors/?q=ai%3Avanhove.pierre"
    - label: "GitHub"
      url: "https://github.com/pierrevanhove"
    - label: "YouTube"
      url: "https://www.youtube.com/playlist?list=PL_yIFPZJJb4o-gLw6nkL2XH26NxbZKCoh"
    - label: "Wikipedia"
      url: "https://fr.wikipedia.org/wiki/Pierre_Vanhove"

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
  - assets-OLD
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: false
      share: false
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
      share: true
  # _collaborators
  - scope:
      path: ""
      type: collaborators
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _conferences
  - scope:
      path: ""
      type: conferences
    values:
      layout: single
      author_profile: true
      share: true
      comments: false
  # _books
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Europe/Paris

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-remote-theme
  - jekyll-include-cache

remote_theme           : "mmistakes/minimal-mistakes"
minimal_mistakes_skin  : "air"   # options: "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development